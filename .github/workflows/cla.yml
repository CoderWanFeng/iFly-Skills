name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    env:
      CLA_REMOTE_ORG: ${{ vars.CLA_SIGNATURE_STORE_ORG }}
      CLA_REMOTE_REPO: ${{ vars.CLA_SIGNATURE_STORE_REPO }}
      CLA_REMOTE_BRANCH: ${{ vars.CLA_SIGNATURE_STORE_BRANCH }}
      CLA_SIGNATURE_STORE_PAT: ${{ secrets.CLA_SIGNATURE_STORE_PAT }}
    steps:
      - name: "Validate CLA Signature Store"
        if: ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target') && (env.CLA_REMOTE_ORG == '' || env.CLA_REMOTE_REPO == '' || env.CLA_SIGNATURE_STORE_PAT == '')
        run: |
          echo "::error::CLA signature storage must be configured in a dedicated remote repository."
          echo "::error::Set repository variables CLA_SIGNATURE_STORE_ORG / CLA_SIGNATURE_STORE_REPO, optionally CLA_SIGNATURE_STORE_BRANCH, and repository secret CLA_SIGNATURE_STORE_PAT."
          echo "::error::This workflow intentionally refuses to write signatures back to this repository to avoid fork PR diffs and merge conflicts."
          exit 1
      - name: "CLA Assistant"
        if: ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target') && env.CLA_REMOTE_ORG != '' && env.CLA_REMOTE_REPO != '' && env.CLA_SIGNATURE_STORE_PAT != ''
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ env.CLA_SIGNATURE_STORE_PAT }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/iflytek/iFly-Skills/blob/main/CLA.md'
          remote-organization-name: ${{ env.CLA_REMOTE_ORG }}
          remote-repository-name: ${{ env.CLA_REMOTE_REPO }}
          branch: ${{ vars.CLA_SIGNATURE_STORE_BRANCH || 'main' }}
          allowlist: 'dependabot[bot],dependabot-preview[bot]'
